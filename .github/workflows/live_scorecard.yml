name: Live Scorecard 月度落盘

on:
  schedule:
    # 每月 1 号 UTC 07:30(北京 15:30;schedule 有延迟,月报无准点要求)
    - cron: '30 7 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Run scorecard (stdlib only)
        run: python scripts/live_scorecard.py
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed/live_scorecard.md data/processed/live_scorecard.csv
          git diff --staged --quiet || (git commit -m "[scorecard] $(date +%Y-%m-%d) 实盘记录月度落盘" && git push)
