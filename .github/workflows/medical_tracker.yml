name: 医药板块每日监控 + 推送

on:
  schedule:
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 权限下沉到 job 级：仅本 job 需要提交生成物与创建 issue（安全扫描整改）
    permissions:
      contents: write
      issues: write

    steps:
      # 安全加固：第三方 action 固定到 commit SHA，防止 tag 被篡改
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install
        # 依赖固定精确版本（见 requirements.txt），避免供应链漂移
        run: pip install -r requirements.txt

      - name: Verify code
        run: |
          python -c "from src.models.rule_registry import evaluate_signal, ACTIVE_MODEL_VERSION; print(f'Version: {ACTIVE_MODEL_VERSION}')"
          python -c "from app.tracker import _compute, _load_data; print('Tracker OK')"

      - name: Run monitor
        id: monitor
        # 医药侧不注入 PUSH_KEY：其独立推送被抑制，微信由下方合并推送统一发出（每天 1 条）
        run: |
          timeout 900 python app/notify.py 2>&1 | tee output.txt || true
          python app/ci_parse.py

      - name: Load results
        id: parsed
        run: cat alert_result.txt >> $GITHUB_OUTPUT

      - name: Generate dashboard
        timeout-minutes: 5
        run: timeout 300 python app/dashboard.py || true

      # ── 农业板块子项目（共享同一次运行与推送；医药代码零改动） ──
      - name: Run agri monitor
        id: agri
        run: |
          pip install -r agriculture/requirements.txt
          timeout 900 python agriculture/app/tracker_agri.py 2>&1 | tee output_agri.txt || true
          python agriculture/app/ci_parse_agri.py

      - name: Load agri results
        id: agri_parsed
        run: cat alert_result_agri.txt >> $GITHUB_OUTPUT

      - name: Combined WeChat push（医药+农业 每天一条）
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
        run: python agriculture/app/notify_combined.py || true

      - name: Generate agri dashboard
        timeout-minutes: 5
        run: timeout 300 python agriculture/app/dashboard_agri.py || true

      - name: Commit
        timeout-minutes: 2
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          # -f 必需：这些路径在 .gitignore 中，普通 add 会静默跳过
          git add -f dashboard.html data/processed/signals.db dashboard_agri.html agriculture/data/processed/signals.db 2>/dev/null || true
          # 农业数据缓存一并入库：Actions 无本地缓存，单数据源故障时可回退到昨日缓存
          git add -f agriculture/data/raw/cache/*.csv 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "[auto] $(date +%Y-%m-%d) 医药:${{ steps.parsed.outputs.alert }} 农业:${{ steps.agri_parsed.outputs.alert }}（${{ steps.agri_parsed.outputs.summary }}）" && git push || true)

      - name: Issue (RED)
        if: steps.parsed.outputs.alert == 'red'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const fs = require('fs');
            const out = fs.existsSync('output.txt') ? fs.readFileSync('output.txt','utf8').slice(0,4000) : '';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `ARMED! Score=${{ steps.parsed.outputs.score }} (${new Date().toISOString().split('T')[0]})`,
              body: '```\n' + out + '\n```\n\nV5.2 四因子两层判定 (n_factors>=2 + tier)',
              labels: ['armed','alert']
            });

      - name: Agri Daily Issue (RED/YELLOW 滚动日报)
        if: steps.agri_parsed.outputs.alert == 'red' || steps.agri_parsed.outputs.alert == 'yellow'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const fs = require('fs');
            const out = fs.existsSync('output_agri.txt') ? fs.readFileSync('output_agri.txt','utf8').slice(0,4000) : '';
            const label = 'agri-daily';
            const list = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 1
            });
            const body = '## ' + new Date().toISOString().split('T')[0] + '（' + '${{ steps.agri_parsed.outputs.alert }}'.toUpperCase() + '）\n\n```\n' + out + '\n```\n看板：dashboard_agri.html ｜ 报告：agriculture/REPORT.md';
            let issueNumber;
            if (list.data.length > 0) {
              issueNumber = list.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, body: body
              });
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '农业板块每日信号（滚动日报，YELLOW/RED 更新）',
                body: body, labels: [label]
              });
              issueNumber = created.data.number;
            }
            // RED 时再单独开一条警报 issue（保留医药 ARMED 的对称语义）
            if ('${{ steps.agri_parsed.outputs.alert }}' === 'red') {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `农业信号! Score=${{ steps.agri_parsed.outputs.score }} (${new Date().toISOString().split('T')[0]})`,
                body: '```\n' + out + '\n```\n\nV1.2 周期主导：cycle_score 迟滞门 + 恐慌加速',
                labels: ['agri-alert','alert']
              });
            }


      - name: Deploy dashboards to GitHub Pages
        timeout-minutes: 3
        run: |
          mkdir -p pages_tmp
          cd pages_tmp
          git init -q -b gh-pages
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          cp ../dashboard.html ../dashboard_agri.html . 2>/dev/null || true
          printf '%s\n' '<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>板块监控看板</title>' \
            '<style>body{font-family:system-ui,"Microsoft YaHei";max-width:640px;margin:40px auto;padding:0 16px}' \
            'a{display:block;margin:12px 0;padding:16px;border:1px solid #ddd;border-radius:10px;text-decoration:none;color:#2c3e50;font-size:18px}' \
            'a:hover{background:#f4f6f8}</style></head><body>' \
            '<h2>板块监控看板</h2>' \
            '<a href="dashboard_agri.html">农业板块周期监控</a>' \
            '<a href="dashboard.html">医药板块风险收益监控</a>' \
            '<p style="color:#888;font-size:13px">每日 14:45（北京时间，工作日）自动更新</p>' \
            '</body></html>' > index.html
          git add -A
          git diff --staged --quiet || git commit -q -m "pages: $(date +%Y-%m-%d)"
          git push -q -u origin gh-pages || git push -q -f origin gh-pages || echo "pages push skipped"
