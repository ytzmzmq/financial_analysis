name: 医药板块每日监控 + 推送

on:
  schedule:
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 权限下沉到 job 级：仅本 job 需要提交生成物与创建 issue（安全扫描整改）
    permissions:
      contents: write
      issues: write

    steps:
      # 安全加固：第三方 action 固定到 commit SHA，防止 tag 被篡改
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install
        # 依赖固定精确版本（见 requirements.txt），避免供应链漂移
        run: pip install -r requirements.txt

      - name: Verify code
        run: |
          python -c "from src.models.rule_registry import evaluate_signal, ACTIVE_MODEL_VERSION; print(f'Version: {ACTIVE_MODEL_VERSION}')"
          python -c "from app.tracker import _compute, _load_data; print('Tracker OK')"

      - name: Run monitor
        id: monitor
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: |
          timeout 900 python app/notify.py 2>&1 | tee output.txt || true
          python app/ci_parse.py

      - name: Load results
        id: parsed
        run: cat alert_result.txt >> $GITHUB_OUTPUT

      - name: Generate dashboard
        timeout-minutes: 5
        run: timeout 300 python app/dashboard.py || true

      - name: Commit
        timeout-minutes: 2
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          # -f 必需：这两个路径在 .gitignore 中，普通 add 会静默跳过
          git add -f dashboard.html data/processed/signals.db 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "[auto] $(date +%Y-%m-%d) ${{ steps.parsed.outputs.alert }}" && git push || true)

      - name: Issue (RED)
        if: steps.parsed.outputs.alert == 'red'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const fs = require('fs');
            const out = fs.existsSync('output.txt') ? fs.readFileSync('output.txt','utf8').slice(0,4000) : '';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `ARMED! Score=${{ steps.parsed.outputs.score }} (${new Date().toISOString().split('T')[0]})`,
              body: '```\n' + out + '\n```\n\nV5.2 四因子两层判定 (n_factors>=2 + tier)',
              labels: ['armed','alert']
            });
